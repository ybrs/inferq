[package]
name = "qwen-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Inspectable CPU inference for Qwen3-Coder-Next"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.9"
bytemuck = "1.25.2"
candle-core = "0.11.0"
candle-nn = "0.11.0"
clap = { version = "4.6.0", features = ["derive"] }
half = "2.7.1"
memmap2 = "0.9.11"
num_cpus = "1.17.0"
rand = "0.9.2"
rayon = "1.11.0"
safetensors = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
tokio = { version = "1.53.1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
