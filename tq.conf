# tq.conf - where tq finds the taskq agent hub, and who this agent says it is.
#
# Copy this to one of the places tq looks, in order:
#
#   $TQ_CONF              an explicit path, which wins over everything
#   ./tq.conf             the directory the agent is started in
#   ~/.config/tq/tq.conf  this user's agents
#   /etc/tq.conf          every agent in the container
#
# One "key = value" per line. Blank lines and lines starting with # are
# ignored. An unknown key is an error rather than something quietly skipped:
# a misspelled "sever" would otherwise read as "no server configured", and tq
# would look like it was working right up until someone tried to restart it.
#
# tq itself prints nothing once the agent is running, so a mistake in here
# shows up as an agent that never appears in `taskq agent list`. Set TQ_LOG to
# a file path to get tq's own account of what it is doing.

# --------------------------------------------------------------------------
# Required: the hub's websocket address.
# --------------------------------------------------------------------------
# `taskq serve` runs the hub on port 9999 by default. From inside a container
# the host is reachable as host.docker.internal on Docker Desktop, or at the
# bridge gateway (usually 172.17.0.1) on Linux - the same address you already
# point the MCP server at, with the port and path changed.
server = ws://172.17.0.1:7778/agents

# --------------------------------------------------------------------------
# The shared secret, when the hub requires one.
# --------------------------------------------------------------------------
# The same value as TASKQ_MCP_TOKEN on the server. Required whenever the hub
# is bound to anything but loopback, which it must be to be reachable from a
# container at all. Leave it out only for a hub on 127.0.0.1.
token = TASKQ_MCP_TOKEN_2398329r0qa

# --------------------------------------------------------------------------
# Optional: who this agent is, and what it is working on.
# --------------------------------------------------------------------------
# The name defaults to the hostname, which inside a container is the one
# docker gave it. Two agents may share a name; taskq tells them apart by
# (name, host, cwd) and gives each a stable id, which is what you actually
# restart against - `taskq agent restart 2`.
# name = worker-a

# The taskq task this agent is working on, so the connection is visible next
# to the work. A task that does not exist is refused at connection time
# rather than filed against nothing.
# task = 412

# The taskq project it belongs to, by name or id.
# project = taskq
